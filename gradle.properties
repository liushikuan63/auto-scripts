# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 使用 Microsoft OpenJDK 17（标准 HotSpot，避免 GraalVM jlink 在 core-for-system-modules.jar 自动模块名 'for' 关键字报错）
org.gradle.java.home=D:\\Java\\jdk\\microsoft-jdk-17
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Allow non-ASCII paths (Windows)
android.overridePathCheck=true
# Kotlin code style
kotlin.code.style=official
# 签名校验（在未安装 Android SDK 机器上需允许构建失败但代码仍可编译）
# 注意: 需要本地安装 Android SDK 并在 local.properties 中指定 sdk.dir