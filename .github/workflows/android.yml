name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify wrapper and permissions
        run: |
          test -f settings.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Code health audit (gate self-test + real tree)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/audit-code-health-selftest.ps1
          pwsh -NoProfile -File ./scripts/audit-code-health.ps1
          pwsh -NoProfile -File ./scripts/audit-naming.ps1
          pwsh -NoProfile -File ./scripts/audit-comments.ps1
          pwsh -NoProfile -File ./scripts/audit-structure.ps1
          pwsh -NoProfile -File ./scripts/audit-params.ps1

      - name: Unit tests, lint and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
